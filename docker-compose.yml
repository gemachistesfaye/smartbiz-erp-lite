version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartbiz-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartbiz_erp_lite
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartbiz-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbiz-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartbiz_erp_lite?schema=public
      JWT_SECRET: your-super-secret-jwt-key
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_SECRET: your-super-secret-refresh-key
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartbiz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbiz-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001/api
    networks:
      - smartbiz-network

volumes:
  postgres_data:

networks:
  smartbiz-network:
    driver: bridge
